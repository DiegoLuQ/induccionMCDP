services:
  induccion_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: induccion_app
    env_file:
      - .env
    environment:
      # Dentro del contenedor "localhost" no apunta al MySQL del servidor,
      # por eso se usa una URL propia para Docker.
      - DATABASE_URL=${DOCKER_DATABASE_URL}
      - APP_URL=https://${DOMAIN}
      # Proxy inverso + SSL (nginx-proxy / acme-companion)
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    # Persiste los videos subidos entre reconstrucciones del contenedor.
    volumes:
      - induccion_uploads:/app/public/uploads
    networks:
      - red_produccion
    restart: always

networks:
  red_produccion:
    external: true

volumes:
  induccion_uploads:
